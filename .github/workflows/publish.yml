name: Publish to PyPI

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - name: Lint and format check
        run: |
          uvx ruff@0.9.4 check src benchmarks tests
          uvx ruff@0.9.4 format --check src benchmarks tests
      - name: Run tests
        run: uv run --locked --group dev pytest -q
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          if not os.environ["GITHUB_REF"].startswith("refs/tags/"):
              print("Branch validation run; release tag check is not applicable.")
              raise SystemExit(0)
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must be v{version}")
          PY
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Check distribution metadata
        run: uvx --from twine twine check --strict dist/*
      - name: Smoke-test the wheel outside the checkout
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel/bin/python" "$GITHUB_WORKSPACE/tests/smoke/wheel.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/nemotron-extraction
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Publish with Trusted Publishing
        run: uv publish --trusted-publishing always

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish release and attach distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Activation hooks for the official Nemotron 3 Nano BF16 checkpoint.

          - Hugging Face Transformers and asynchronous vLLM extraction with six hook types.
          - Cross-backend validation benchmark for English, German and Spanish.

          See the README and docs/report.pdf for measurements.
          EOF
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Nemotron Extraction $RELEASE_TAG" --notes-file release-notes.md
